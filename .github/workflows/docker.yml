# Builds the container on every push to main and on version tags, and publishes it to
# GitHub Container Registry (ghcr.io/<owner>/drocsid). Unraid pulls from there.
name: Build & publish image

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: for f in src/*.js web/*.js; do node --check "$f"; done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke test (fresh setup and .env import)
        run: |
          npm install --no-audit --no-fund
          npm run build
          node scripts/smoke.mjs
          node scripts/sources-test.mjs

      - name: Docker image test (fresh install permissions, setup saves)
        run: sh scripts/docker-test.sh

      # Other branches are tested only; images are published from main.
      - name: Stop here unless main
        id: gate
        run: echo "publish=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.publish == 'true'

      - uses: docker/login-action@v3
        if: steps.gate.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        if: steps.gate.outputs.publish == 'true'
        name: Read version from package.json
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: meta
        if: steps.gate.outputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/drocsid
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        if: steps.gate.outputs.publish == 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
