<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drocsid</title>
  <link rel="stylesheet" href="/activity/style.css" />
</head>
<body>
  <video id="video" playsinline></video>

  <div id="screen" class="screen">
    <div class="dot"></div>
    <h1 id="screenTitle">Connecting…</h1>
    <p id="screenText"></p>
  </div>

  <!-- Paused: ⏸ sits in the center until it plays again; then it turns into ▶ and fades out. -->
  <div id="ppMark" class="pp-mark" hidden aria-hidden="true"></div>
  <div id="note" class="note" hidden></div>

  <button id="tapToPlay" class="tap" hidden>▶ Tap to start watching</button>
  <button id="unmute" class="unmute" hidden>🔇 Tap to unmute</button>

  <div id="ui" class="ui" hidden>
    <div class="top"><span id="title"></span><span id="badge" class="badge"></span></div>
    <div class="bottom">
      <button id="playPause" class="ctl" title="Play/Pause">⏸</button>
      <input id="seek" type="range" min="0" max="100" value="0" step="1" />
      <div id="liveTag" class="livetag" hidden><span class="livedot"></span>LIVE</div>
      <span id="time" class="time"></span>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="1" title="Volume (just for you)" />
      <button id="stop" class="ctl danger" title="Stop for everyone">⏹</button>
    </div>
  </div>

  <script type="module" src="/activity/app.js"></script>
</body>
</html>
