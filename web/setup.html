<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>drocsid · Setup</title>
  <link rel="icon" href="/browse/img/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/browse/img/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/browse/img/apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: linear-gradient(#e9edf2, #dde3ea); font: 13px/1.45 Verdana, Tahoma, "Segoe UI", sans-serif; color: #1c2733; min-height: 100vh; }
    [hidden] { display: none !important; }
    .shell { max-width: 820px; margin: 24px auto; background: #fff; border: 1px solid #7e8893; box-shadow: 0 12px 40px rgba(10,30,60,.25); }
    .head { display: flex; align-items: center; gap: 16px; padding: 14px 18px; background: linear-gradient(#fff, #eef0f2); border-bottom: 1px solid #c9ced4; }
    .wm { height: 40px; width: auto; display: block; }
    .head .sub { font: bold 11px Verdana; letter-spacing: 2px; color: #6b7682; text-transform: uppercase; }
    .steps { display: flex; background: linear-gradient(#104a83, #062a4f); border-bottom: 2px solid #041d38; }
    .steps div { flex: 1; padding: 7px 6px; text-align: center; font: bold 10px Verdana; letter-spacing: 1px; text-transform: uppercase; color: #7fa6cc; border-right: 1px solid #0a3a6a; }
    .steps div.done { color: #bfe0ff; } .steps div.done::before { content: "✓ "; }
    .steps div.on { color: #fff; background: linear-gradient(#2a8fe0, #135ea8); }
    .body { padding: 20px 24px; min-height: 280px; }
    h2 { margin: 0 0 4px; font: bold 20px Arial, sans-serif; color: #1a86d8; }
    .lead { color: #56616d; margin: 0 0 14px; }
    .field { margin: 10px 0; } .field label { display: block; font-weight: bold; font-size: 12px; margin-bottom: 4px; }
    .field input { width: 100%; padding: 8px 10px; border: 1px solid #b3b9c1; font: 13px system-ui, sans-serif; }
    .hint { font-size: 11px; color: #6b7682; margin-top: 3px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; } .row > .field { flex: 1; min-width: 220px; }
    .copy { display: flex; gap: 6px; align-items: center; background: #f4f6f8; border: 1px solid #d3d8de; padding: 5px 8px; font: 12px monospace; margin: 4px 0; }
    .copy span { flex: 1; word-break: break-all; } .copy button { border: 0; background: none; font: bold 10px Verdana; color: #1a86d8; cursor: pointer; }
    .box { border: 1px solid #d3d8de; background: #f8fafc; padding: 10px 12px; margin: 10px 0; }
    .box h4 { margin: 0 0 6px; font: bold 10px Verdana; letter-spacing: 1.5px; text-transform: uppercase; color: #6b7682; }
    .ok { color: #2f7a2f; font-weight: bold; } .wait { color: #b7791f; font-weight: bold; } .bad { color: #c0392b; font-weight: bold; }
    .btn { display: inline-block; padding: 7px 16px; border: 1px solid #7e8893; background: linear-gradient(#fff, #e3e7ec); font: bold 12px Arial, sans-serif; text-transform: uppercase; letter-spacing: .5px; color: #0b3663; cursor: pointer; text-decoration: none; border-radius: 3px; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.primary { background: linear-gradient(#2a8fe0, #135ea8); border-color: #0b3663; color: #fff; }
    .btn.discord { background: #5865f2; border-color: #3c45a5; color: #fff; } .btn.plex { background: #e5a00d; border-color: #a87400; color: #1b1b1b; }
    .btn.sm { padding: 3px 9px; font-size: 10px; }
    .foot-l { display: flex; gap: 8px; }
    .foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; border-top: 1px solid #e3e6ea; background: #f6f7f8; }
    ol.g { margin: 6px 0 0 18px; padding: 0; } ol.g li { margin: 5px 0; }
    .checks { list-style: none; margin: 10px 0 0; padding: 0; } .checks li { margin: 4px 0; } .checks .hint { margin-left: 18px; }
    .srv { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px solid #d3d8de; margin: 8px 0; background: #fff; }
    .srv img, .srv .ic { width: 38px; height: 38px; border-radius: 50%; background: #5865f2; color: #fff; display: grid; place-items: center; font: 900 16px Arial; flex: none; }
    .srv .ic.plex { border-radius: 6px; background: #1f1f1f; color: #e5a00d; }
    .srv .grow { flex: 1; } .srv .n { font-weight: bold; } .srv .m { font-size: 11px; color: #6b7682; }
    .conns label { display: flex; gap: 8px; align-items: center; font: 12px monospace; margin: 4px 0 4px 50px; cursor: pointer; }
    .conns .tag { font: bold 9px Verdana; padding: 1px 6px; border-radius: 8px; background: #eef2f6; color: #56616d; border: 1px solid #d3d8de; }
    .code { font: bold 22px monospace; letter-spacing: 4px; padding: 8px 12px; border: 1px dashed #1a86d8; background: #f1f8ff; width: 230px; text-transform: uppercase; text-align: center; }
    .err { color: #c0392b; font-weight: bold; min-height: 1.2em; margin-top: 8px; }
    .or { margin: 16px 0 6px; font: bold 10px Verdana; letter-spacing: 1.5px; color: #6b7682; text-transform: uppercase; }
    code { background: #eef2f6; padding: 1px 4px; }
    .pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 14px 0; }
    .card { border: 2px solid #d3d8de; padding: 16px; text-align: center; background: #fff; cursor: pointer; font: inherit; color: inherit; }
    .card:hover { border-color: #8cc2ee; } .card.on { border-color: #1a86d8; background: #f1f8ff; }
    .logo { width: 56px; height: 56px; margin: 0 auto 8px; display: block; object-fit: contain; }
    img.ic { background: none !important; object-fit: contain; }
    .card .n { font: bold 15px Arial, sans-serif; } .card .m { font-size: 11px; color: #6b7682; margin-top: 4px; }
    @media (max-width: 640px) { .pick { grid-template-columns: 1fr; } }
    @media (max-width: 640px) { .shell { margin: 0; } .steps div { font-size: 8px; letter-spacing: 0; } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="head"><img class="wm" src="/browse/img/drocsid-logo.svg" alt="drocsid" height="40" /><span class="sub" id="mode">Setup</span></div>
    <div class="steps" id="steps"></div>
    <div class="body" id="body"><p class="lead">Loading…</p></div>
    <div class="foot"><span class="foot-l"><a class="btn" id="cancel" href="/browse/admin.html#connections" hidden>Cancel</a><button class="btn" id="back">← Back</button></span><span class="err" id="err"></span><button class="btn primary" id="next">Continue →</button></div>
  </div>
  <script type="module" src="/setup/setup.js"></script>
</body>
</html>
