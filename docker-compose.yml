# For Unraid's Compose Manager plugin, or any Docker host.
services:
  plexcord:
    image: ghcr.io/GITHUB_OWNER/plexcord:latest
    container_name: plexcord
    restart: unless-stopped
    env_file: .env
    volumes:
      - /mnt/user/appdata/plexcord:/data
    networks:
      - proxy-net   # same network as Nginx Proxy Manager / cloudflared
    labels:
      - com.centurylinklabs.watchtower.enable=true

networks:
  proxy-net:
    external: true
