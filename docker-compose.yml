# For Unraid's Compose Manager plugin, or any Docker host. Then open https://<your address>/setup/ (see README).
services:
  drocsid:
    image: ghcr.io/vtdrocsid/drocsid:latest
    container_name: drocsid
    restart: unless-stopped
    ports:
      - "3000:3000"   # or drop this and join your reverse proxy's Docker network instead
    volumes:
      - /mnt/user/appdata/drocsid:/data
